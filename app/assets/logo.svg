<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Anime Plus">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16358F"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="stroke-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8FFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
    <clipPath id="clip-rect">
      <rect x="8" y="8" width="104" height="104" rx="28"/>
    </clipPath>
  </defs>

  <!-- Fond arrondi -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bg-grad)"/>

  <!-- Lueur derrière le contour -->
  <rect x="8" y="8" width="104" height="104" rx="28"
        fill="none"
        stroke="#2F6BFF"
        stroke-width="2.5"
        opacity="0.35"
        filter="url(#glow)"/>

  <!-- Contour principal -->
  <rect x="8" y="8" width="104" height="104" rx="28"
        fill="none"
        stroke="url(#stroke-grad)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Triangle play (centré légèrement à gauche) -->
  <path d="M38 36 L70 60 L38 84 Z"
        fill="url(#stroke-grad)"
        opacity="0.95"/>

  <!-- Branche verticale du + -->
  <line x1="88" y1="68" x2="88" y2="92"
        stroke="url(#stroke-grad)"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Branche horizontale du + -->
  <line x1="76" y1="80" x2="100" y2="80"
        stroke="url(#stroke-grad)"
        stroke-width="5"
        stroke-linecap="round"/>
</svg>

